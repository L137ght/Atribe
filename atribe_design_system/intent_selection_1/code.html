<style>
        body {
            background-color: #120a0e;
        }
        .editorial-quote {
            border-left: 3px solid #8f0164;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
    </style>

    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-background selection:bg-primary-container selection:text-white min-h-screen flex flex-col font-body-md">
<!-- TopAppBar -->
<header class="fixed top-0 z-50 w-full bg-zinc-950/70 backdrop-blur-xl border-b border-white/10 flex justify-between items-center px-6 py-4">
<div class="flex items-center gap-4">
<button class="text-zinc-100 hover:bg-white/5 transition-colors p-2 rounded-full">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="text-2xl font-serif italic text-pink-700 dark:text-pink-600 tracking-tight">Atribe</h1>
</div>
<div class="flex items-center">
<img alt="Profile" class="w-8 h-8 rounded-full border border-white/10 object-cover" data-alt="Close-up professional portrait of a woman with minimalist aesthetic, soft dramatic studio lighting, moody dark background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDjo2QNjvooieioFn_ceFCmU5SwnpNDQoi09HRlPGS88QyZ0gQWRt6DhP5tQiMQHCrtfzbCGE2tb0JAPTLOXRB03zR6M8Z4vlalfFdZ9SR3Iaqx9HvLJveF3RWrhO-3oXalSRYZ4uiJ-t6wCmzGhLIg-t12r5bead4uVzlUrtyZJAwjqNzuArjZqxq0MZtRjG3w6mn1deeNjPrwyChLvkQz6u-rqmENWoSyFag5KXdMdATaM4QnTirv8PIKSN28qC3T5HWRMoTClNrB"/>
</div>
</header>
<main class="flex-grow flex flex-col justify-center items-center px-margin pt-32 pb-16">
<!-- Content Container -->
<div class="max-w-4xl w-full">
<!-- Hero Title -->
<div class="mb-xl text-center">
<p class="font-label-caps text-primary tracking-[0.2em] mb-sm uppercase">Join the Inner Circle</p>
<h2 class="font-h1 text-h1 text-on-background mb-md">Choose your path</h2>
<div class="editorial-quote pl-6 py-2 mx-auto max-w-xl">
<p class="font-h3 text-h3 italic text-on-surface-variant leading-relaxed">
                        "Creativity is the soul of the community. How will you shape our collective future today?"
                    </p>
</div>
</div>
<!-- Bento Selection Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-md items-stretch">
<!-- Option 1: Support Creators -->
<button class="group relative flex flex-col text-left h-full bg-surface-container-low border border-white/5 p-lg rounded-xl transition-all duration-300 hover:bg-surface-container hover:border-primary/30">
<div class="absolute top-6 right-6 opacity-20 group-hover:opacity-100 transition-opacity text-primary">
<span class="material-symbols-outlined text-4xl" data-icon="favorite">favorite</span>
</div>
<div class="mt-auto">
<div class="mb-md">
<span class="material-symbols-outlined text-primary text-4xl" data-icon="explore">explore</span>
</div>
<h3 class="font-h2 text-h2 mb-xs text-on-surface group-hover:text-primary transition-colors">Support creators</h3>
<p class="font-body-md text-on-surface-variant leading-relaxed">
                            Discover hidden gems, subscribe to exclusive editorial journals, and fund the next generation of intellectual depth.
                        </p>
<div class="mt-md flex items-center gap-2 text-primary font-label-caps opacity-0 group-hover:opacity-100 transition-all translate-x-[-10px] group-hover:translate-x-0">
<span>ENTER THE ARCHIVE</span>
<span class="material-symbols-outlined text-sm" data-icon="arrow_forward">arrow_forward</span>
</div>
</div>
<!-- Subtle tonal shift background for depth -->
<div class="absolute inset-0 bg-gradient-to-br from-primary/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity rounded-xl -z-10"></div>
</button>
<!-- Option 2: I am a Creator -->
<button class="group relative flex flex-col text-left h-full bg-surface-container-low border border-white/5 p-lg rounded-xl transition-all duration-300 hover:bg-surface-container hover:border-primary/30">
<div class="absolute top-6 right-6 opacity-20 group-hover:opacity-100 transition-opacity text-primary">
<span class="material-symbols-outlined text-4xl" data-icon="edit_note">edit_note</span>
</div>
<div class="mt-auto">
<div class="mb-md">
<span class="material-symbols-outlined text-primary text-4xl" data-icon="auto_stories">auto_stories</span>
</div>
<h3 class="font-h2 text-h2 mb-xs text-on-surface group-hover:text-primary transition-colors">I am a creator</h3>
<p class="font-body-md text-on-surface-variant leading-relaxed">
                            Harness premium tools to publish your thoughts, manage your community, and monetize your intellectual property with grace.
                        </p>
<div class="mt-md flex items-center gap-2 text-primary font-label-caps opacity-0 group-hover:opacity-100 transition-all translate-x-[-10px] group-hover:translate-x-0">
<span>START YOUR JOURNAL</span>
<span class="material-symbols-outlined text-sm" data-icon="arrow_forward">arrow_forward</span>
</div>
</div>
<div class="absolute inset-0 bg-gradient-to-br from-primary/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity rounded-xl -z-10"></div>
</button>
</div>
<!-- Contextual Footer Message -->
<div class="mt-xl text-center">
<p class="text-on-surface-variant font-body-md opacity-60">
                    You can change your primary focus at any time in your profile settings.
                </p>
</div>
</div>
</main>

<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-4 pb-6 pt-3 bg-zinc-950/80 backdrop-blur-lg border-t border-white/5 z-50 rounded-t-lg md:hidden">

<span class="material-symbols-outlined" data-icon="directions_run">directions_run</span>
<span class="font-sans text-[10px] font-medium tracking-widest uppercase mt-1">Route</span>
</a>
<a class="flex flex-col items-center justify-center text-zinc-500 hover:text-zinc-300" href="#">
<span class="material-symbols-outlined" data-icon="link">link</span>
<span class="font-sans text-[10px] font-medium tracking-widest uppercase mt-1">Links</span>
</a>
<a class="flex flex-col items-center justify-center text-zinc-500 hover:text-zinc-300" href="#">
<span class="material-symbols-outlined" data-icon="group">group</span>
<span class="font-sans text-[10px] font-medium tracking-widest uppercase mt-1">Creators</span>
</a>
<a class="flex flex-col items-center justify-center text-zinc-500 hover:text-zinc-300" href="#">
<span class="material-symbols-outlined" data-icon="explore">explore</span>
<span class="font-sans text-[10px] font-medium tracking-widest uppercase mt-1">Discover</span>
</a>
</nav>
